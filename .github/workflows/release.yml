name: Release

# Publicación de versiones: al crear una etiqueta (por ejemplo v1.0.0) se prueban
# los cambios y se crea un Release en GitHub con el CSV de precios de ese momento.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python main.py
      - run: python -m src.verificacion site
      - name: Crear el Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" site/portatiles.csv \
            --title "Versión ${GITHUB_REF_NAME}" \
            --generate-notes
