name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests --max-line-length 120
      - name: Pruebas
        run: python -m pytest -v
